<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="220" height="60" role="img" aria-label="FreshVegStore logo">
  <defs>
    <style>
      .fvs-leaf { fill: #2d7a4f; }
      .fvs-leaf-dark { fill: #1f5c3f; }
      .fvs-word-fresh { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 23px; fill: #1f5c3f; }
      .fvs-word-veg { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 23px; fill: #e8845a; }
      .fvs-tag { font-family: 'Inter', Arial, sans-serif; font-size: 8px; letter-spacing: .12em; fill: #6b7770; }
    </style>
  </defs>
  <!-- leaf mark -->
  <g transform="translate(2,6)">
    <path class="fvs-leaf" d="M24 2C11 2 2 12 2 25c0 12 9 21 22 23 2-13 2-30 0-46z"/>
    <path class="fvs-leaf-dark" d="M24 2c13 0 22 10 22 23 0 12-9 21-22 23V2z"/>
    <path d="M24 6v40" stroke="#eaf5ee" stroke-width="1.4" fill="none"/>
  </g>
  <text x="56" y="30" class="fvs-word-fresh">Fresh<tspan class="fvs-word-veg">Veg</tspan></text>
  <text x="56" y="43" class="fvs-tag">STORE · VPO ASRON</text>
</svg>
